# Sprint 5 simulation host (Gazebo Harmonic + PX4 SITL + simhost API).
#
#   docker compose -f docker-compose.yml -f docker-compose.sim.yml up -d --build simhost
#
# The backend generates worlds into ./backend/sim_workspace, which the
# simulator sees as /workspace. Telemetry goes to the `nats` service on the
# same compose network. simhost listens on http://localhost:8100.
services:
  simhost:
    build:
      context: ./sim
    image: dronematrx/simhost:dev
    container_name: dronematrx_simhost
    restart: unless-stopped
    init: true  # reap orphaned PX4 helper processes (no zombies)
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      NATS_STREAM: DRONES
      SIM_WORKSPACE: /workspace
      # Capacity limit for this machine (Docker VM: 8 GB RAM). The Sprint 5
      # 16-instance target needs the NUC i7 / 64 GB reference machine.
      SIM_MAX_INSTANCES: ${SIM_MAX_INSTANCES:-8}
      GZ_IP: 127.0.0.1
      PYTHONPATH: /opt/shared:/opt/simhost
      MEDIAMTX_RTSP: rtsp://mediamtx:8554
      MEDIAMTX_PUBLISH_USER: dmx-publisher
      MEDIAMTX_PUBLISH_PASS: ${MEDIAMTX_PUBLISH_PASS:-dmx-publisher-dev}
    ports:
      - "8100:8100"
    shm_size: "2gb"
    volumes:
      - ./sim/simhost:/opt/simhost/simhost:ro
      - ./sim/tests:/opt/simhost/tests:ro
      # Single source of truth for the geographic <-> Gazebo transform.
      - ./backend/app/services/simulation/geo.py:/opt/shared/enu.py:ro
      - ./backend/sim_workspace:/workspace
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Sprint 6 media relay: RTSP in (simhost), WebRTC/WHEP out, recording + DVR playback.
  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    container_name: dronematrx_mediamtx
    restart: unless-stopped
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: ${MEDIAMTX_PUBLISH_PASS:-dmx-publisher-dev}
      MTX_AUTHINTERNALUSERS_1_PASS: ${MEDIAMTX_BACKEND_PASS:-dmx-backend-dev}
      # ICE host candidates the relay advertises. Browsers gather candidates on
      # LAN interfaces, not loopback, so include this machine's LAN IP:
      #   MEDIAMTX_WEBRTC_HOSTS=127.0.0.1,192.168.1.20 docker compose ... up -d mediamtx
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_HOSTS:-127.0.0.1}
    volumes:
      - ./sim/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - mediamtx_recordings:/recordings
    ports:
      - "127.0.0.1:8889:8889"        # WHEP (backend only)
      - "127.0.0.1:9997:9997"        # control API (backend only)
      - "127.0.0.1:9996:9996"        # DVR playback (backend only)
      # WebRTC media on all interfaces: media flows only for sessions the
      # authenticated backend negotiated (ICE credentials per session).
      - "8189:8189/udp"
      - "8189:8189"                  # TCP fallback

volumes:
  mediamtx_recordings:
